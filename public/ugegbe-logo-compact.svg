<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 290" width="1024" height="290" fill="none">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;display=swap");
      .tagline {
        font-family: "Outfit", sans-serif;
        font-weight: 800;
        font-size: 21px;
        letter-spacing: 15px;
        fill: #DFE4E8;
      }
      .gwr-text {
        font-family: "Outfit", sans-serif;
        font-weight: 800;
        fill: #FFFFFF;
      }
    </style>
    <!-- Seal paths for curved text -->
    <path id="seal-top" d="M 723 160 A 42 42 0 0 1 807 160" />
    <path id="seal-bottom" d="M 807 160 A 42 42 0 0 1 723 160" />
  </defs>

  <!-- 1. Floating Silver Dot to the left of "u" -->
  <circle cx="68" cy="125" r="17" fill="#DFE4E8" />

  <!-- 2. LETTER "u" (Mint) -->
  <path d="M 142 75 L 142 175 C 142 225, 208 225, 208 175 L 208 75" 
        stroke="#23E2A0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 3. LETTER "ç" (Mint) -->
  <!-- Circular body with bottom-right open and descending tail -->
  <path d="M 338 105 A 64 64 0 1 0 338 215" 
        stroke="#23E2A0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cedilla / descender loop -->
  <path d="M 334 212 C 345 228, 362 250, 362 268" 
        stroke="#23E2A0" stroke-width="16" stroke-linecap="round" />

  <!-- 4. LETTER "e" (Mint) - slanted crossbar cutting through circle -->
  <path d="M 490 120 A 64 64 0 1 0 496 182" 
        stroke="#23E2A0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Angled crossbar cutting upwards at 32 degrees -->
  <line x1="392" y1="195" x2="505" y2="122" 
        stroke="#23E2A0" stroke-width="16" stroke-linecap="round" />

  <!-- 5. LETTER "g" / "q" (Silver) - circular bowl with diagonal descending tail -->
  <circle cx="602" cy="160" r="64" 
          stroke="#DFE4E8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 666 160 L 545 268" 
        stroke="#DFE4E8" stroke-width="16" stroke-linecap="round" />

  <!-- 6. LETTER "b" (Silver) - tall ascender stem & bowl with GWR Seal -->
  <!-- Tall ascender extending to top of canvas -->
  <line x1="688" y1="14" x2="688" y2="224" 
        stroke="#DFE4E8" stroke-width="16" stroke-linecap="round" />
  <!-- Bowl circle -->
  <circle cx="765" cy="160" r="64" 
          stroke="#DFE4E8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Official Guinness World Records Co-Branded Seal inside "b" bowl -->
  <g id="gwr-seal">
    <!-- Dark navy circular disc -->
    <circle cx="765" cy="160" r="56" fill="#003B64" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="765" cy="160" r="49" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="3 2" />

    <!-- GUINNESS text on top arc -->
    <text class="gwr-text" font-size="10.5" letter-spacing="1.5" text-anchor="middle">
      <textPath href="#seal-top" startOffset="50%">GUINNESS</textPath>
    </text>

    <!-- WORLD RECORDS text on bottom arc -->
    <text class="gwr-text" font-size="9" letter-spacing="1.2" text-anchor="middle">
      <textPath href="#seal-bottom" startOffset="50%">WORLD RECORDS</textPath>
    </text>

    <!-- Golden 5-point star -->
    <polygon points="765,134 768.5,145 779,145 770.5,152 774,163 765,156 756,163 759.5,152 751,145 761.5,145" fill="#E5A91A" />

    <!-- Guinness Harp representation beneath star -->
    <rect x="746" y="164" width="38" height="4.5" fill="#FFFFFF" rx="1.2" />
    <line x1="752" y1="170" x2="752" y2="184" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="758" y1="170" x2="758" y2="184" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="765" y1="170" x2="765" y2="184" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="772" y1="170" x2="772" y2="184" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="778" y1="170" x2="778" y2="184" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <rect x="749" y="184" width="32" height="3.5" fill="#FFFFFF" rx="1" />
  </g>

  <!-- 7. LETTER "e" (Silver) - standard crossbar -->
  <path d="M 975 140 A 64 64 0 1 0 970 195" 
        stroke="#DFE4E8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="851" y1="160" x2="978" y2="160" 
        stroke="#DFE4E8" stroke-width="16" stroke-linecap="round" />

  
</svg>